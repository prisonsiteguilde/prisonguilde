<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Рецепты, калькулятор добычи и гайды для игры Ton Prison в Telegram" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Ton Prison — Гайды</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles-ultra.css" />
  <link rel="stylesheet" href="./css/affixes.css" />
  <link rel="stylesheet" href="./css/baryga.css" />
</head>
<body class="theme-dark">

  <div class="app-shell">

    <header class="topbar">
      <div class="brand">
        <div class="logo-wrap">
          <div class="logo-icon">🔒</div>
        </div>
        <div class="brand-text">
          <div class="brand-title">TON PRISON</div>
          <div class="brand-sub">ГАЙДЫ / РЕЦЕПТЫ / КАЛЬКУЛЯТОР</div>
        </div>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-route="recipes" type="button">
          <span class="tab-icon">📋</span>
          <span class="tab-label">Рецепты</span>
        </button>
        <button class="tab" data-route="calculator" type="button">
          <span class="tab-icon">🚬</span>
          <span class="tab-label">Калькулятор</span>
        </button>
        <button class="tab" data-route="affixes" type="button">
          <span class="tab-icon">✨</span>
          <span class="tab-label">Аффиксы</span>
        </button>
        <button class="tab" data-route="baryga" type="button">
          <span class="tab-icon">🏪</span>
          <span class="tab-label">Барыга</span>
        </button>
        <button class="tab" data-route="bosses" type="button">
          <span class="tab-icon">👹</span>
          <span class="tab-label">Боссы</span>
        </button>
        <button class="tab" data-route="minions" type="button">
          <span class="tab-icon">👥</span>
          <span class="tab-label">Шестёрки</span>
        </button>
        <button class="tab" data-route="sets" type="button">
          <span class="tab-icon">👕</span>
          <span class="tab-label">Сеты</span>
        </button>
        <button class="tab" data-route="effects" type="button">
          <span class="tab-icon">⚔️</span>
          <span class="tab-label">Эффекты</span>
        </button>
      </nav>

      <div class="topbar-actions">
        <button class="theme-btn" id="themeToggle" title="Сменить тему">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div id="page" class="page-container"></div>
    </main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="bnav-btn active" data-route="recipes" type="button">
        <span class="bnav-icon">📋</span>
        <span class="bnav-label">Рецепты</span>
      </button>
      <button class="bnav-btn" data-route="calculator" type="button">
        <span class="bnav-icon">🚬</span>
        <span class="bnav-label">Калькулятор</span>
      </button>
      <button class="bnav-btn" data-route="affixes" type="button">
        <span class="bnav-icon">✨</span>
        <span class="bnav-label">Аффиксы</span>
      </button>
      <button class="bnav-btn" data-route="baryga" type="button">
        <span class="bnav-icon">🏪</span>
        <span class="bnav-label">Барыга</span>
      </button>
      <button class="bnav-btn" data-route="bosses" type="button">
        <span class="bnav-icon">👹</span>
        <span class="bnav-label">Боссы</span>
      </button>
      <button class="bnav-btn" data-route="minions" type="button">
        <span class="bnav-icon">👥</span>
        <span class="bnav-label">Шестёрки</span>
      </button>
      <button class="bnav-btn" data-route="sets" type="button">
        <span class="bnav-icon">👕</span>
        <span class="bnav-label">Сеты</span>
      </button>
      <button class="bnav-btn" data-route="effects" type="button">
        <span class="bnav-icon">⚔️</span>
        <span class="bnav-label">Эффекты</span>
      </button>
    </nav>

  </div>

  <div id="notifyHost" class="notify-host" aria-live="polite"></div>
  <div id="modalHost" class="modal-host hidden"></div>

  <button class="scroll-top-btn" id="scrollTopBtn" title="Наверх">↑</button>

  <script type="module" src="./js/app.js?v=2.9"></script>
  <script>
    // Scroll-to-top logic
    const scrollBtn = document.getElementById("scrollTopBtn");
    const mainEl = document.querySelector(".app-main");
    if (mainEl && scrollBtn) {
      mainEl.addEventListener("scroll", () => {
        scrollBtn.classList.toggle("visible", mainEl.scrollTop > 300);
      }, { passive: true });
      // Fallback: window scroll
      window.addEventListener("scroll", () => {
        scrollBtn.classList.toggle("visible", window.scrollY > 300);
      }, { passive: true });
      scrollBtn.addEventListener("click", () => {
        mainEl.scrollTo({ top: 0, behavior: "smooth" });
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  </script>
</body>
</html>
